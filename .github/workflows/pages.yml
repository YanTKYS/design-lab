name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # 公開用の成果物（github-pages）を作ってアップロードする。デプロイとは別のジョブにして、
  # デプロイだけを再実行したときに同じ名前の成果物を二重にアップロードしないようにする
  upload:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      # ビルド不要の静的サイトなので site/ をそのまま公開する
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # アップロード直後は、同じ実行の成果物の一覧にまだ出ないことがある（0件と判定されて失敗した）。
      # 取得の前に少し待つ
      - name: Wait for the uploaded artifact to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
